name: backupzit-server
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: BackupZit <support@backupzit.example>
description: |
  BackupZit management server: web console and API for BackupZit agents.
vendor: BackupZit
homepage: https://github.com/backupzit/backupzit
license: AGPL-3.0-only
recommends:
  - postgresql
  - postgresql-client
contents:
  - src: ./LICENSE
    dst: /usr/share/doc/backupzit-server/copyright
  - src: ./THIRD_PARTY_LICENSES.txt
    dst: /usr/share/doc/backupzit-server/THIRD_PARTY_LICENSES.txt
  - src: ./bin/linux/agents/*
    dst: /usr/share/backupzit/dist/
  - src: ./bin/linux/backupzit-server
    dst: /usr/bin/backupzit-server
    file_info:
      mode: 0755
  - src: ./packaging/linux/backupzit-server.service
    dst: /usr/lib/systemd/system/backupzit-server.service
  - src: ./packaging/linux/backupzit-update.path
    dst: /usr/lib/systemd/system/backupzit-update.path
  - src: ./packaging/linux/backupzit-update.service
    dst: /usr/lib/systemd/system/backupzit-update.service
  - src: ./packaging/linux/server.env
    dst: /etc/backupzit/server.env
    type: config|noreplace
    file_info:
      mode: 0640
scripts:
  postinstall: ./packaging/linux/server-postinstall.sh
