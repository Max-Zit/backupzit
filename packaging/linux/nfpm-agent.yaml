name: backupzit-agent
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: BackupZit <support@backupzit.example>
description: |
  BackupZit backup agent. Backs up files, folders, whole Linux systems and,
  on Proxmox VE hosts, virtual machines and containers, as instructed by the
  BackupZit management server.
vendor: BackupZit
homepage: https://github.com/Max-Zit/backupzit
license: AGPL-3.0-only
contents:
  - src: ./LICENSE
    dst: /usr/share/doc/backupzit-agent/copyright
  - src: ./THIRD_PARTY_LICENSES.txt
    dst: /usr/share/doc/backupzit-agent/THIRD_PARTY_LICENSES.txt
  - src: ./bin/linux/backupzit-agent
    dst: /usr/bin/backupzit-agent
    file_info:
      mode: 0755
  - src: ./packaging/linux/backupzit-agent.service
    dst: /usr/lib/systemd/system/backupzit-agent.service
  - dst: /etc/backupzit
    type: dir
    file_info:
      mode: 0700
scripts:
  postinstall: ./packaging/linux/agent-postinstall.sh
  preremove: ./packaging/linux/agent-preremove.sh
