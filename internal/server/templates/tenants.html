{{define "content"}}
<h1>Tenants</h1>
<div class="panel">
  {{if .Data}}
  <div class="table-wrap"><table>
    <tr><th>Name</th><th>Slug</th><th>Agents</th><th>Jobs</th><th>Created</th><th></th></tr>
    {{range .Data}}
    <tr>
      <td>{{.Name}}</td><td class="mono">{{.Slug}}</td><td>{{.Agents}}</td><td>{{.Jobs}}</td><td>{{ts .CreatedAt}}</td>
      <td><form method="post" action="/tenants/{{.ID}}/delete" class="inline" data-confirm="Delete tenant {{.Name}} with all its agents, jobs and history? Backup data on storage is not deleted."><button class="link">Delete</button></form></td>
    </tr>
    {{end}}
  </table></div>
  {{else}}<p class="muted">No tenants yet. Create one for each customer (or one for your own company).</p>{{end}}
</div>
<div class="panel">
  <h2>New tenant</h2>
  <form method="post" action="/tenants" class="stack">
    <label>Name <input name="name" required placeholder="Acme d.o.o."></label>
    <div><button>Create tenant</button></div>
  </form>
</div>
{{end}}
