{{define "reauth"}}{{if .TwoFactor}}<label class="mt">{{T "Confirm with the current code from your authenticator app"}} <input name="reauth_code" inputmode="numeric" autocomplete="one-time-code" maxlength="32"></label>{{else if eq .Source "sso"}}<p class="muted small mt">{{T "To delete backups, turn on two-factor sign-in under My account first."}}</p>{{else}}<label class="mt">{{T "Confirm with your password"}} <input name="reauth_password" type="password" autocomplete="current-password"></label>{{end}}{{end}}
