{{define "content"}}
<div class="login panel">
  <div class="brand">{{template "logo"}}<span>Backup<b>Zit</b></span></div>
  <p class="sub">{{T "Sign in to the backup console"}}</p>
  <form method="post" action="/login" class="stack">
    <label>{{T "Username"}} <input name="username" autocomplete="username" required autofocus></label>
    <label>{{T "Password"}} <input name="password" type="password" autocomplete="current-password" required></label>
    <button>{{T "Sign in"}}</button>
  </form>
</div>
<div class="login-langs">{{template "langswitch"}}</div>
<p class="login-foot">{{template "icon" "lock"}} {{T "Self-hosted · data stays on your network"}}</p>
{{end}}
