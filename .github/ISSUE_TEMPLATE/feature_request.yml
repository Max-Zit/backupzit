name: Feature request
description: Suggest something BackupZit should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to achieve?
      description: Describe the situation and what is missing today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could BackupZit help?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
