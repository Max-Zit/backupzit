name: Container image

# Builds the console's container image from the signed server package of a
# release and publishes it to ghcr.io/max-zit/backupzit:
#   release candidate (pre-release)  -> :<version> and :testing
#   official release                 -> :<version> and :latest
# When a candidate is promoted, the same image is tagged :latest (no rebuild).

on:
  release:
    types: [published, released]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.46.0"
        required: true
      channel:
        description: "Also tag as: testing, latest or none"
        required: true
        default: none

permissions:
  contents: read

jobs:
  image:
    name: Build and publish
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name != 'testing'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/max-zit/backupzit
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Sign in to ghcr.io
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Version and channel
        id: v
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          IN_VERSION: ${{ inputs.version }}
          IN_CHANNEL: ${{ inputs.channel }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            version="$IN_VERSION"; channel="$IN_CHANNEL"
          else
            version="${TAG#v}"
            if [ "$PRERELEASE" = true ]; then channel=testing; else channel=latest; fi
          fi
          case "$version" in *[!0-9.]*|"") echo "bad version $version"; exit 1;; esac
          case "$channel" in testing|latest|none) ;; *) echo "bad channel $channel"; exit 1;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          # A promoted candidate already has its image: only the tag moves.
          if [ "$ACTION" = released ] && docker manifest inspect "$IMAGE:$version" >/dev/null 2>&1; then
            echo "retag=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ steps.v.outputs.version }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.v.outputs.retag != 'true'
        with:
          go-version-file: go.mod

      - name: Download and verify the signed server package
        if: steps.v.outputs.retag != 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          deb="backupzit-server_${VERSION}_amd64.deb"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" -D packaging/docker \
            -p manifest.json -p manifest.json.sig -p "$deb"
          go run ./tools/release verify -dir packaging/docker -file "$deb"

      - name: Build and push
        if: steps.v.outputs.retag != 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
          CHANNEL: ${{ steps.v.outputs.channel }}
        run: |
          docker build --pull --build-arg VERSION="$VERSION" -t "$IMAGE:$VERSION" packaging/docker
          docker push "$IMAGE:$VERSION"
          if [ "$CHANNEL" != none ]; then
            docker tag "$IMAGE:$VERSION" "$IMAGE:$CHANNEL"
            docker push "$IMAGE:$CHANNEL"
          fi

      - name: Tag the existing image
        if: steps.v.outputs.retag == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$VERSION"
