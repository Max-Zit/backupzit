name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch cancels the older run (fewer runs, and one
# e-mail per push at most: the security checks are jobs of this workflow;
# security.yml repeats them weekly for new vulnerabilities in unchanged code).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l ./cmd ./internal ./tools)" || (gofmt -l ./cmd ./internal ./tools; exit 1)
      - name: go vet
        run: go vet ./...
      - name: Tests
        run: go test -count=1 -timeout 50m ./...

  windows:
    name: Build (Windows)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build and vet for Windows
        env:
          GOOS: windows
        run: |
          go build ./...
          go vet ./...

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: staticcheck (Linux and Windows)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          checks="all,-ST1000,-ST1003,-ST1005,-ST1013,-ST1020,-ST1021,-ST1022,-S1011,-S1017,-SA1019"
          staticcheck -checks "$checks" ./...
          GOOS=windows staticcheck -checks "$checks" ./...

  gosec:
    name: gosec (Linux and Windows)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gosec (reviewed false positives carry "#nosec <rule> -- reason")
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          gosec -quiet ./...
          GOOS=windows gosec -quiet ./...

  govulncheck:
    name: govulncheck (Go vulnerability database)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck -format sarif ./... > govulncheck.sarif
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

  race:
    name: Race detector (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fetch the test PostgreSQL once (parallel test binaries would all download it)
        run: go test -race -count=1 -run '^TestJobEnableAudited$' ./internal/server
      - name: Tests with -race
        run: go test -race -count=1 -timeout 80m ./...

  fuzz:
    name: Fuzz parsers of untrusted input (short)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz each target for 20 s
        run: |
          set -e
          for t in api:FuzzDecodeEnrollCode repo:FuzzParsePackHeader repo:FuzzDecodeIndexFile repo:FuzzParseID \
                   repo:FuzzDecodeBlob vmware:FuzzParseVMX vmware:FuzzParseDSPath update:FuzzVerify update:FuzzNewer \
                   fsutil:FuzzParseSnapshotPath netcfg:FuzzParseNetworkFile vmfs:FuzzParseLVMConfig vmfs:FuzzVolumes \
                   hardened:FuzzValidName server:FuzzParseSchedule server:FuzzLocalPath server:FuzzParseSSOState \
                   server:FuzzParseMFAToken server:FuzzParseIdPMetadata server:FuzzParseKeyPair; do
            go test "./internal/${t%%:*}" -run '^$' -fuzz "^${t##*:}\$" -fuzztime 20s
          done
