name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# A newer push to the same branch cancels the older run (fewer runs, and one
# e-mail per push at most: the security checks are jobs of this workflow;
# security.yml repeats them weekly for new vulnerabilities in unchanged code).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l ./cmd ./internal ./tools)" || (gofmt -l ./cmd ./internal ./tools; exit 1)
      - name: go vet
        run: go vet ./...
      - name: Cache the test PostgreSQL (downloaded from Maven by embedded-postgres)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: embedded-postgres-${{ runner.os }}-
      - name: Fetch the test PostgreSQL once, with retries (a failed download used to fail every test)
        run: |
          ok=0
          for i in 1 2 3; do
            if go test -count=1 -run '^TestJobEnableAudited$' ./internal/server; then ok=1; break; fi
            echo "PostgreSQL download or start failed, try $i of 3"; sleep 30
          done
          test "$ok" = 1
      - name: Tests
        run: go test -count=1 -timeout 50m ./...

  windows:
    name: Build (Windows)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build and vet for Windows
        env:
          GOOS: windows
        run: |
          go build ./...
          go vet ./...

  macos:
    # The macOS agent (universal: Apple silicon and Intel): built natively, since the menu bar
    # app needs cgo and AppKit. Only the agent-side packages are tested
    # here: the console runs on Linux.
    name: Build and test (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go build and go vet
        run: |
          go build ./...
          go vet ./...
      - name: Tests (agent-side packages)
        run: >-
          go test -count=1 -timeout 30m
          ./internal/agent ./internal/archiver ./internal/restorer ./internal/fsutil ./internal/repo
          ./internal/e2e ./internal/macperm ./internal/localipc ./internal/apfssnap ./internal/launchd
          ./cmd/backupzit-agent ./cmd/backupzit-tray
      - name: staticcheck of the menu bar app (needs cgo, so here natively)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck -checks "all,-ST1000,-ST1003,-ST1005,-ST1013,-ST1020,-ST1021,-ST1022,-S1011,-S1017,-SA1019" ./cmd/backupzit-tray
      - name: Installer scripts
        run: |
          for f in packaging/macos/build-pkg.sh packaging/macos/uninstall.sh packaging/macos/test-scripts.sh \
                   packaging/macos/scripts/preinstall packaging/macos/scripts/postinstall; do
            /bin/sh -n "$f"
          done
          ./packaging/macos/test-scripts.sh
      - name: Installer package (built and checked, not uploaded)
        run: |
          OUT_DIR="$RUNNER_TEMP/pkg" WORK_DIR="$RUNNER_TEMP/pkgwork" ./packaging/macos/build-pkg.sh 0.0.0-ci
          pkg="$RUNNER_TEMP/pkg/backupzit-agent_0.0.0-ci_darwin_universal.pkg"
          pkgutil --payload-files "$pkg" | grep -qx './Library/BackupZit/bin/backupzit-agent'
          pkgutil --payload-files "$pkg" | grep -qx './Applications/BackupZit.app/Contents/Info.plist'
          pkgutil --expand "$pkg" "$RUNNER_TEMP/pkgexpanded"
          test -x "$RUNNER_TEMP/pkgexpanded/backupzit-agent-component.pkg/Scripts/postinstall"
          grep -q 'hostArchitectures="arm64,x86_64"' "$RUNNER_TEMP/pkgexpanded/Distribution"
          # The programs are universal; the Intel half runs under Rosetta
          # where the runner has it (Intel Macs are tested by users).
          agent="$RUNNER_TEMP/pkgwork/payload/Library/BackupZit/bin/backupzit-agent"
          lipo -archs "$agent" | grep -q x86_64
          lipo -archs "$agent" | grep -q arm64
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 "$agent" version
          else
            echo "Rosetta is not installed on this runner; the x86_64 program was built but not run"
          fi
          test -f "$RUNNER_TEMP/pkgexpanded/Resources/en.lproj/conclusion.html"

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: staticcheck (Linux, Windows and macOS)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          checks="all,-ST1000,-ST1003,-ST1005,-ST1013,-ST1020,-ST1021,-ST1022,-S1011,-S1017,-SA1019"
          staticcheck -checks "$checks" ./...
          GOOS=windows staticcheck -checks "$checks" ./...
          # The menu bar app is left out here: without cgo (a Linux runner)
          # fyne.io/systray has no darwin code to check it against. The
          # macOS job checks it natively.
          GOOS=darwin GOARCH=arm64 staticcheck -checks "$checks" $(GOOS=darwin GOARCH=arm64 go list ./... | grep -v '/cmd/backupzit-tray$')

  gosec:
    name: gosec (Linux, Windows and macOS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gosec (reviewed false positives carry "#nosec <rule> -- reason")
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          # third_party/ holds patched copies of other projects (see their NOTICE.BackupZit).
          gosec -quiet -exclude-dir=third_party ./...
          GOOS=windows gosec -quiet -exclude-dir=third_party ./...
          GOOS=darwin GOARCH=arm64 gosec -quiet -exclude-dir=third_party ./...

  govulncheck:
    name: govulncheck (Go vulnerability database)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck -format sarif ./... > govulncheck.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

  race:
    name: Race detector (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Cache the test PostgreSQL (downloaded from Maven by embedded-postgres)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: embedded-postgres-${{ runner.os }}-
      - name: Fetch the test PostgreSQL once, with retries (a failed download used to fail every test)
        run: |
          ok=0
          for i in 1 2 3; do
            if go test -race -count=1 -run '^TestJobEnableAudited$' ./internal/server; then ok=1; break; fi
            echo "PostgreSQL download or start failed, try $i of 3"; sleep 30
          done
          test "$ok" = 1
      - name: Tests with -race (all packages except internal/server, which has its own job)
        run: go test -race -count=1 -timeout 60m $(go list ./... | grep -v '/internal/server$')

  race-server:
    # The console's tests under -race in one process outgrew a runner: it
    # was shut down after 40-50 min (0.52, 0.53). They run in four parts by
    # test name, each in its own process and runner; together they cover
    # every test, fuzz seed and example of the package. The memory and disk
    # in use are logged every two minutes.
    name: Race detector (Linux, console ${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: A-C
            tests: '^(Test[A-C]|Fuzz|Example)'
          - part: D-L
            tests: '^Test[D-L]'
          - part: M-R
            tests: '^Test[M-R]'
          - part: S-Z
            tests: '^Test([S-Z]|[^A-Z])'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Cache the test PostgreSQL (downloaded from Maven by embedded-postgres)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: embedded-postgres-${{ runner.os }}-
      - name: Fetch the test PostgreSQL once, with retries (a failed download used to fail every test)
        run: |
          ok=0
          for i in 1 2 3; do
            if go test -race -count=1 -run '^TestJobEnableAudited$' ./internal/server; then ok=1; break; fi
            echo "PostgreSQL download or start failed, try $i of 3"; sleep 30
          done
          test "$ok" = 1
      - name: Tests with -race (internal/server, ${{ matrix.part }})
        env:
          TESTS: ${{ matrix.tests }}
        run: |
          (while sleep 120; do echo "resources: memory $(free -m | awk '/^Mem:/{print $3 "/" $2}') MB, disk $(df -h / | awk 'NR==2{print $3 "/" $2}')"; done) &
          go test -race -count=1 -timeout 80m -run "$TESTS" ./internal/server

  fuzz:
    name: Fuzz parsers of untrusted input (short)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz each target for 20 s
        run: |
          set -e
          for t in api:FuzzDecodeEnrollCode repo:FuzzParsePackHeader repo:FuzzDecodeIndexFile repo:FuzzParseID \
                   repo:FuzzDecodeBlob vmware:FuzzParseVMX vmware:FuzzParseDSPath update:FuzzVerify update:FuzzNewer \
                   fsutil:FuzzParseSnapshotPath netcfg:FuzzParseNetworkFile vmfs:FuzzParseLVMConfig vmfs:FuzzVolumes vmfs:FuzzLZO1X vmfs:FuzzBtrfsBlock \
                   hardened:FuzzValidName hardened:FuzzParseKeyLine server:FuzzParseSchedule server:FuzzLocalPath server:FuzzParseSSOState \
                   server:FuzzParseMFAToken server:FuzzParseIdPMetadata server:FuzzParseKeyPair \
                   server:FuzzParseRecoveryKey server:FuzzCheckSAMLResponse recovery:FuzzParseAccessEnvelope \
                   imaging:FuzzParsePnputilDevices imaging:FuzzSetLayoutEntry \
                   imaging/ntfsresize:FuzzOpen imaging/ntfsresize:FuzzParseRecord imaging/ntfsresize:FuzzDecodeRuns; do
            go test "./internal/${t%%:*}" -run '^$' -fuzz "^${t##*:}\$" -fuzztime 20s
          done
